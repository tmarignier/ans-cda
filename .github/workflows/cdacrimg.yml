# Intégration continue de la librairie CdaCrImg : build, tests (dont validation XSD Java et schématrons
# ANS) sous Linux et Windows, puis paquet NuGet.
name: CdaCrImg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une seule exécution par branche / PR : une exécution devenue obsolète est annulée.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build et tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Java : validation XSD et schématrons ANS (tests Category=Schematron).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restauration
        run: dotnet restore dotnet/CdaCrImg.sln

      - name: Build
        run: dotnet build dotnet/CdaCrImg.sln -c Release --no-restore

      - name: Tests
        run: dotnet test dotnet/CdaCrImg.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: TestResults

      - name: Paquet NuGet
        if: runner.os == 'Linux'
        run: dotnet pack dotnet/src/CdaCrImg -c Release --no-build -o artifacts

      - name: Publication du paquet (artefact)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*
